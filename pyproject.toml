[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gmgn-meme-monitor"
version = "1.0.2"
description = "GMGN Meme coin realtime desktop floating monitor"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7.0",
    "requests>=2.32.0",
    "Pillow>=10.3.0",
    "websocket-client>=1.8.0",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.8.0"]

[project.scripts]
gmgn-meme-monitor = "gmgn_monitor.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gmgn_monitor = ["assets/chains/*.svg", "assets/emoji/*.txt"]
